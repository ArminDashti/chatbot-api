# Production-like stack: Postgres + API + WebUI (Nginx).
# WebUI is the only published service; Nginx proxies /api and /health to the API.
#
#   docker network create chatbot-net   # if missing
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Open: http://127.0.0.1:5184

name: chatbot

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatbot-postgres
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    volumes:
      - chatbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: dockerfile
    image: pc-armin/chatbot:api
    pull_policy: build
    container_name: chatbot-api
    environment:
      ADDR: ":8134"
      DATABASE_URL: postgres://chatbot:chatbot@postgres:5432/chatbot?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      MIGRATIONS_DIR: /app/migrations
      CHAT_BASE_URL: ${CHAT_DOCKER_BASE_URL:-http://host.docker.internal:8130/v1}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-auto}
      CORS_ORIGINS: http://127.0.0.1:5184,http://localhost:5184,http://pc-armin
      KNOWLEDGE_DIR: /knowledge
      GIN_MODE: release
    expose:
      - "8134"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8134/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - default

  webui:
    build:
      context: ../chatbot-webui
      dockerfile: Dockerfile
    image: pc-armin/chatbot:webui
    pull_policy: build
    container_name: chatbot-webui
    environment:
      API_HOST: chatbot-api
      API_PORT: "8134"
    ports:
      - "${PUBLISH_PORT:-5184}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    name: chatbot-net
    external: true

volumes:
  chatbot_pgdata:
