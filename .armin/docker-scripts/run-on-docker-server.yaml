# Remote deploy settings — YAML only (no CLI flags).
# Fill ssh and volume_dir before running server deploy.

stack_name: chatbot-api
image_tag: pc-armin/chatbot:api
compose_file: ../../docker-compose.yml
dockerfile: ../../dockerfile
docker_network: chatbot-net
internal_port: "8134"
publish_port: ""
delete_volume: "no"
delete_image: "yes"
build_image_on: "local"

ssh: "ssh <alias>"

volume_dir: "/home/<user>/docker/chatbot"
