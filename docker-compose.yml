# Production-style stack (API image + Postgres). Local hot-reload uses docker-compose.local.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: chatbot-postgres
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot
    expose:
      - "5432"
    ports:
      - "5442:5432"
    volumes:
      - chatbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - chatbot-net

  api:
    image: ${IMAGE_TAG:-chatbot-api:latest}
    container_name: chatbot-api
    environment:
      ADDR: ":${INTERNAL_PORT:-8134}"
      DATABASE_URL: postgres://chatbot:chatbot@postgres:5432/chatbot?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      MIGRATIONS_DIR: /app/migrations
      CHAT_BASE_URL: ${CHAT_DOCKER_BASE_URL:-http://host.docker.internal:8130/v1}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-auto}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5184,http://127.0.0.1:5184,http://pc-armin}
      KNOWLEDGE_DIR: /knowledge
      GIN_MODE: release
    expose:
      - "${INTERNAL_PORT:-8134}"
    ports:
      - "${PUBLISH_PORT:-8134}:${INTERNAL_PORT:-8134}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chatbot-net

  webui:
    image: pc-armin/chatbot:webui
    container_name: chatbot-webui
    environment:
      API_HOST: chatbot-api
      API_PORT: "8134"
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - chatbot-net

networks:
  chatbot-net:
    name: ${DOCKER_NETWORK:-chatbot-net}
    external: true

volumes:
  chatbot_pgdata:
